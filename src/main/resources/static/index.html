<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="checker">
      <button id="getPaid">Get Paid</button>
      <p id="response">Click <b>Get Paid</b> to check if you qualify</p>
    </div>

    <div id="content">
      <div>
        <label id="numb">0</label>
      </div>
      <div id="buttons">
        <button id="decrease">Decrease</button>
        <button id="increase">Increase</button>
        <button id="reset">Reset</button>
      </div>
    </div>

    <form id="formContainer">
      <div id="formTitlec">
        <label id="formTitle">Lets get your information set up</label>
      </div>

      <section>
        <div>
          <label>Name</label>
          <input type="text" id="name" placeholder="Enter Name" />
        </div>
        <div>
          <label>Age</label>
          <input type="number" id="age" placeholder="Enter Age" />
        </div>
      </section>

      <section id="genderSection">
        <div>
          <label id="genderSectionTitle">Select Gender</label>
        </div>
        <div id="genderSectionContent">
          <div>
            <label for="maleCheckBox">Male</label>
            <input type="radio" id="maleCheckBox" name="gender" />
          </div>
          <div>
            <label for="femaleCheckBox">Female</label>
            <input type="radio" id="femaleCheckBox" name="gender" />
          </div>
          <div>
            <label for="otherCheckBox">Other</label>
            <input type="radio" id="otherCheckBox" name="gender" />
            <input type="text" id="otherCheckBoxField" placeholder="Specify" />
          </div>
        </div>
      </section>

      <div>
        <button type="button" id="submit">Submit</button>
      </div>

      <p id="confirmation"></p>
    </form>
    <section id="weatherSection">
      <div id="weatherForm">
        <input type="text" class="cityInput" placeholder="Enter City" />
        <button type="button" class="getWeather">Get Weather</button>
      </div>
      <div id="weatherCard" style="display: none"></div>
    </section>
  </body>
  <script src="/script.js"></script>
</html>
